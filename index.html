<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card" aria-label="待辦清單">
        <header class="todo-header">
          <h1>待辦清單</h1>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換到深色模式">
            <span class="theme-icon" aria-hidden="true">🌙</span>
            <span class="theme-label">深色模式</span>
          </button>
        </header>

        <form id="todo-form" class="todo-form" autocomplete="off">
          <input
            id="todo-input"
            type="text"
            placeholder="新增待辦事項"
            aria-label="新增待辦事項"
            maxlength="120"
          />
          <button type="submit" class="add-btn">新增</button>
        </form>

        <nav class="filter-nav" aria-label="待辦篩選">
          <button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">未完成</button>
          <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">已完成</button>
        </nav>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <p id="empty-state" class="empty-state" role="status" aria-live="polite" hidden></p>

        <footer class="todo-footer">
          <span id="todo-count" role="status" aria-live="polite">未完成: 0 項</span>
          <button id="clear-completed" class="clear-completed-btn" type="button" aria-label="清除所有已完成的待辦事項">
            清除已完成
          </button>
        </footer>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
